<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Event Registration System</title>
  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">
    
    <!-- LEFT SIDE: Registration Form -->
    <section class="form-section">
      <div class="form-card">
        <div class="badge">REGISTRATION</div>
        <h2>Register Student</h2>
        <p class="subtitle">Fill out the details below to submit event participation.</p>

        <form id="registrationForm">
          <input type="hidden" id="editIndex" value="-1" />

          <div class="form-group">
            <label for="studentName"><i class="fa-solid fa-user"></i> Student Name</label>
            <input type="text" id="studentName" placeholder="e.g. Abid Subhani" required />
          </div>

          <div class="form-group-row">
            <div class="form-group">
              <label for="studentId"><i class="fa-solid fa-id-card"></i> Student ID</label>
              <input type="text" id="studentId" placeholder="e.g. 44444" required />
            </div>

            <div class="form-group">
              <label for="contactNumber"><i class="fa-solid fa-phone"></i> Contact No.</label>
              <input type="tel" id="contactNumber" placeholder="e.g. 0300-1234567" required />
            </div>
          </div>

          <div class="form-group-row">
            <div class="form-group">
              <label for="department"><i class="fa-solid fa-building-columns"></i> Dept</label>
              <select id="department" required>
                <option value="" disabled selected>Select</option>
                <option value="BSIT">BSIT</option>
                <option value="BSCS">BSCS</option>
                <option value="BSSE">BSSE</option>
                <option value="BBA">BBA</option>
              </select>
            </div>

            <div class="form-group">
              <label for="semester"><i class="fa-solid fa-graduation-cap"></i> Semester</label>
              <select id="semester" required>
                <option value="" disabled selected>Select</option>
                <option value="1st">1st</option>
                <option value="2nd">2nd</option>
                <option value="3rd">3rd</option>
                <option value="4th">4th</option>
                <option value="5th">5th</option>
                <option value="6th">6th</option>
                <option value="7th">7th</option>
                <option value="8th">8th</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="event"><i class="fa-solid fa-calendar-days"></i> Select Event</label>
            <select id="event" required>
              <option value="" disabled selected>Select Event</option>
              <option value="Sports Gala">Sports Gala</option>
              <option value="Culture Day">Culture Day</option>
              <option value="Tech Symposium">Tech Symposium</option>
            </select>
          </div>

          <div class="form-group">
            <label><i class="fa-solid fa-list-check"></i> Activities</label>
            <div class="checkbox-group" id="activitiesContainer">
              <label class="chip-checkbox">
                <input type="checkbox" value="Cricket" name="activity" />
                <span>Cricket</span>
              </label>
              <label class="chip-checkbox">
                <input type="checkbox" value="Football" name="activity" />
                <span>Football</span>
              </label>
              <label class="chip-checkbox">
                <input type="checkbox" value="Traditional Dress" name="activity" />
                <span>Traditional Dress</span>
              </label>
              <label class="chip-checkbox">
                <input type="checkbox" value="Food Display" name="activity" />
                <span>Food Display</span>
              </label>
              <label class="chip-checkbox">
                <input type="checkbox" value="Coding Competition" name="activity" />
                <span>Coding Competition</span>
              </label>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" id="submitBtn" class="btn-primary">
              <i class="fa-solid fa-paper-plane"></i> Submit Registration
            </button>
            <button type="button" id="cancelBtn" class="btn-secondary" style="display: none;">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- RIGHT SIDE: Records Table Section (With spacious background layout) -->
    <section class="table-section">
      <div class="table-header">
        <div>
          <span class="admin-badge">ADMIN PANEL</span>
          <h1>Registration Records</h1>
          <p>View, update, or remove student registrations saved in localStorage.</p>
        </div>
        <button id="clearAllBtn" class="btn-outline-danger">
          <i class="fa-solid fa-trash-can"></i> Clear All Records
        </button>
      </div>

      <div class="table-card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>STUDENT NAME</th>
                <th>STUDENT ID</th>
                <th>CONTACT NO</th>
                <th>DEPT</th>
                <th>SEMESTER</th>
                <th>EVENT</th>
                <th>ACTIVITIES</th>
                <th class="text-right">ACTIONS</th>
              </tr>
            </thead>
            <tbody id="recordsTableBody">
              <!-- Dynamic Rows inserted by script.js -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
